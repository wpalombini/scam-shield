name: scam-shield

services:
  evals:
    build:
      context: .
      dockerfile: evals/Dockerfile
    # The dataset check needs no network, secrets or write access.
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./evals/datasets:/evals/datasets:ro

  db:
    # Private scam-pattern data. Not published to the host, and not started unless named.
    image: postgres:17.4-alpine
    profiles: [knowledge]
    environment:
      POSTGRES_USER: scamshield
      POSTGRES_DB: scamshield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - knowledge-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scamshield -d scamshield"]
      interval: 3s
      timeout: 3s
      retries: 20

  ingest:
    # Fetches official alerts and extracts patterns into the database.
    build:
      context: .
      dockerfile: evals/Dockerfile
    profiles: [knowledge]
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - path: .env
        required: false
    volumes:
      - ./evals/datasets:/evals/datasets:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "scam_shield.ingest"]

  checker:
    build:
      context: .
      dockerfile: evals/Dockerfile
    # Needs the network and the API key, and writes only to evals/reports.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - path: .env
        required: false
    volumes:
      - ./evals/datasets:/evals/datasets:ro
      - ./evals/redteam:/evals/redteam:ro
      - ./evals/reports:/evals/reports

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # Reachable only from this machine. Needs the network and the API key, and writes nothing.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${SCAM_SHIELD_WEB_PORT:-8080}:8080"

volumes:
  knowledge-data:
