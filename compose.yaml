name: scam-shield

services:
  evals:
    build:
      context: .
      dockerfile: evals/Dockerfile
    # The dataset check needs no network, secrets or write access.
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./evals/datasets:/evals/datasets:ro

  checker:
    build:
      context: .
      dockerfile: evals/Dockerfile
    # Needs the network and the API key, and writes only to evals/reports.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - path: .env
        required: false
    volumes:
      - ./evals/datasets:/evals/datasets:ro
      - ./evals/redteam:/evals/redteam:ro
      - ./evals/reports:/evals/reports

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    # Reachable only from this machine. Needs the network and the API key, and writes nothing.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${SCAM_SHIELD_WEB_PORT:-8080}:8080"
